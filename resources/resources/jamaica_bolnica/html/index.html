<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Death Screen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="deathScreen" class="death-overlay hidden">
        <div class="death-veil"></div>

        <div class="death-ui">
            <div class="timer-block">
                <span id="timerLabel" class="timer-label">Respawn za</span>
                <span id="timerText" class="timer-value">10:00</span>
            </div>

            <div class="progress-wrap">
                <div id="progressBar" class="progress-bar"></div>
            </div>

            <div class="hints">
                <p id="hospitalRow" class="hint-row hidden">
                    Pritisnite <kbd class="key key-h">H</kbd> da pozovete bolnicu
                </p>
                <p id="respawnRow" class="hint-row hidden">
                    Pritisnite <kbd class="key key-e">E</kbd> za respawn
                </p>
            </div>
        </div>
    </div>

    <audio id="deathSound" src="deathsound.mp3" preload="auto"></audio>
    <script src="script.js"></script>
</body>
</html>
