<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto Condensed', sans-serif;
        }

        html, body {
            background: transparent;
            min-height: 100vh;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 80px;
        }

        .trivia-container {
            width: 320px;
            max-width: 320px;
            transform: translateY(120%);
            opacity: 0;
            transition: transform 0.35s ease, opacity 0.35s ease;
        }

        .trivia-container.show {
            transform: translateY(0);
            opacity: 1;
        }

        .trivia-container.hide {
            transform: translateY(120%);
            opacity: 0;
        }

        .trivia-box {
            background: linear-gradient(90deg, rgba(124, 58, 237, 0.92) 0%, rgba(59, 130, 246, 0.92) 100%);
            border-radius: 6px;
            padding: 10px;
            color: #fff;
            overflow: hidden;
            word-break: break-word;
        }

        .trivia-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 6px;
        }

        .trivia-header-left {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .trivia-header-left i {
            font-size: 15px;
            color: #fff;
            flex-shrink: 0;
        }

        .trivia-header-left b {
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
        }

        .trivia-badge {
            display: inline-block;
            background: rgba(139, 92, 246, 0.95);
            color: #fff;
            padding: 3px 9px 4px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.4px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .question-text {
            margin-top: 6px;
            font-weight: 400;
            font-size: 14px;
            line-height: 1.35;
            color: #ffffff;
        }

        .trivia-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        .instruction-box {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .key {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 28px;
            height: 28px;
            padding: 0 8px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            font-size: 13px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .instruction-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.92);
            font-weight: 400;
            line-height: 1.3;
        }

        .instruction-text strong {
            color: #fff;
            font-weight: 700;
        }

        .timer-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .timer-label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.65);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-weight: 700;
        }

        .timer {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
        }

        .timer.warning {
            color: #fecaca;
        }

        .reward-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
            padding: 6px 10px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.2);
        }

        .reward-bar i {
            font-size: 13px;
            color: #fde047;
        }

        .reward-text {
            font-size: 13px;
            font-weight: 700;
            color: #fde047;
        }
    </style>
</head>
<body>
    <div class="trivia-container" id="triviaContainer">
        <div class="trivia-box">
            <div class="trivia-header">
                <div class="trivia-header-left">
                    <i class="fas fa-brain"></i>
                    <b>Trivia</b>
                </div>
                <span class="trivia-badge">UZIVO</span>
            </div>

            <div class="question-text" id="questionText">Koji je glavni grad Nemacke?</div>

            <div class="trivia-meta">
                <div class="instruction-box">
                    <span class="key">T</span>
                    <div class="instruction-text">
                        Pritisni <strong>T</strong> i upisi odgovor
                    </div>
                </div>
                <div class="timer-box">
                    <span class="timer-label">Preostalo</span>
                    <span class="timer" id="timer">30</span>
                </div>
            </div>

            <div class="reward-bar">
                <i class="fas fa-coins"></i>
                <span class="reward-text" id="rewardText">Nagrada: $5,000</span>
            </div>
        </div>
    </div>

    <script>
        let timeLeft = 30;
        let timerInterval;
        let notificationAudio;
        let currentSoundFile = 'trivia.mp3';

        function getNotificationAudio(soundFile) {
            if (soundFile && soundFile !== currentSoundFile) {
                currentSoundFile = soundFile;
                notificationAudio = null;
            }

            if (!notificationAudio) {
                notificationAudio = new Audio('./' + currentSoundFile);
                notificationAudio.preload = 'auto';
                notificationAudio.volume = 0.85;
            }

            return notificationAudio;
        }

        function playNotificationSound(soundFile) {
            const audio = getNotificationAudio(soundFile);
            audio.currentTime = 0;
            const playPromise = audio.play();
            if (playPromise && typeof playPromise.catch === 'function') {
                playPromise.catch(() => {});
            }
        }

        function startTimer(seconds) {
            timeLeft = seconds;
            const timerEl = document.getElementById('timer');
            timerEl.textContent = timeLeft;
            timerEl.classList.remove('warning');

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;

                if (timeLeft <= 10) {
                    timerEl.classList.add('warning');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    hideTrivia();
                }
            }, 1000);
        }

        function showTrivia(question, reward, time = 30, soundFile = 'trivia.mp3') {
            const container = document.getElementById('triviaContainer');
            const questionEl = document.getElementById('questionText');
            const rewardEl = document.getElementById('rewardText');

            questionEl.textContent = question || 'Koji je glavni grad Nemacke?';
            rewardEl.textContent = 'Nagrada: ' + (reward || '$5,000');

            container.classList.remove('hide');
            container.classList.add('show');
            playNotificationSound(soundFile);
            startTimer(time);
        }

        function hideTrivia() {
            const container = document.getElementById('triviaContainer');
            container.classList.remove('show');
            container.classList.add('hide');
            clearInterval(timerInterval);
        }

        window.addEventListener('message', function(event) {
            const data = event.data;

            if (data.type === 'showTrivia') {
                showTrivia(data.question, data.reward, data.time, data.sound);
            }

            if (data.type === 'hideTrivia') {
                hideTrivia();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                hideTrivia();
            }
        });
    </script>
</body>
</html>
