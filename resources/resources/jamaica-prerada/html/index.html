<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prerada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="craft-container hidden" id="craftContainer">
        <div class="panel">
            <div class="detail-header">
                <div class="detail-icon" id="detailIcon">
                    <i class="fa-solid fa-flask"></i>
                </div>
                <div>
                    <h2 id="recipeName">—</h2>
                </div>
            </div>

            <div class="recipe-flow">
                <div class="flow-card">
                    <span class="flow-label">Ulaz</span>
                    <div class="flow-item">
                        <img id="inputImg" src="" alt="">
                        <div>
                            <strong id="inputLabel">—</strong>
                        </div>
                    </div>
                    <div class="flow-stock">
                        <i class="fa-solid fa-box"></i>
                        Kod tebe: <span id="inputStock">0</span>
                    </div>
                </div>

                <div class="flow-arrow">
                    <i class="fa-solid fa-arrow-right"></i>
                </div>

                <div class="flow-card">
                    <span class="flow-label">Izlaz</span>
                    <div class="flow-item">
                        <img id="outputImg" src="" alt="">
                        <div>
                            <strong id="outputLabel">—</strong>
                        </div>
                    </div>
                </div>
            </div>

            <div class="craft-meta">
                <div class="meta-item">
                    <i class="fa-solid fa-clock"></i>
                    <span id="craftTime">—</span>
                </div>
            </div>

            <button type="button" class="craft-btn" id="craftBtn">
                <i class="fa-solid fa-hammer"></i> Preradi
            </button>

            <button type="button" class="close-btn" id="closeBtn">
                <i class="fa-solid fa-xmark"></i> Zatvori
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
