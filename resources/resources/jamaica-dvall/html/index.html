<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVALL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        html, body {
            background: transparent;
            min-height: 100vh;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 14px;
        }

        .dvall-container {
            width: min(420px, 88vw);
            transform: translateY(-120%) scale(0.96);
            opacity: 0;
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.32s ease;
            pointer-events: none;
        }

        .dvall-container.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .dvall-container.hide {
            transform: translateY(-120%) scale(0.96);
            opacity: 0;
        }

        .dvall-box {
            position: relative;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.97) 0%, rgba(15, 23, 42, 0.92) 100%);
            border: 1px solid rgba(59, 130, 246, 0.35);
            border-radius: 10px;
            padding: 10px 14px 12px;
            color: #f8fafc;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            overflow: hidden;
        }

        .dvall-box::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top center, rgba(59, 130, 246, 0.12) 0%, transparent 65%);
            pointer-events: none;
        }

        .dvall-content {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dvall-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
            flex-shrink: 0;
        }

        .dvall-icon svg {
            width: 15px;
            height: 15px;
            fill: none;
            stroke: #fff;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .dvall-text {
            min-width: 0;
            flex: 1;
        }

        .dvall-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.1px;
            text-transform: uppercase;
            color: #93c5fd;
            line-height: 1;
            margin-bottom: 3px;
        }

        .dvall-message {
            font-size: 13px;
            font-weight: 500;
            line-height: 1.35;
            color: #e2e8f0;
        }

        .dvall-bar {
            position: relative;
            margin-top: 9px;
            height: 3px;
            border-radius: 999px;
            background: rgba(51, 65, 85, 0.65);
            overflow: hidden;
        }

        .dvall-bar-fill {
            height: 100%;
            width: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #2563eb 0%, #60a5fa 100%);
            transform-origin: left center;
        }

        .dvall-bar-fill.animate {
            animation: dvallDrain linear forwards;
        }

        @keyframes dvallDrain {
            from { transform: scaleX(1); }
            to { transform: scaleX(0); }
        }
    </style>
</head>
<body>
    <div class="dvall-container" id="dvallContainer">
        <div class="dvall-box">
            <div class="dvall-content">
                <div class="dvall-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 9v4"></path>
                        <path d="M12 17h.01"></path>
                        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    </svg>
                </div>
                <div class="dvall-text">
                    <div class="dvall-title" id="dvallTitle">DVALL</div>
                    <div class="dvall-message" id="dvallMessage">Prazna vozila se brišu radi boljeg FPS-a.</div>
                </div>
            </div>
            <div class="dvall-bar">
                <div class="dvall-bar-fill" id="dvallBar"></div>
            </div>
        </div>
    </div>

    <script>
        let hideTimeout;

        function showDvall(title, message, duration) {
            const container = document.getElementById('dvallContainer');
            const bar = document.getElementById('dvallBar');
            const seconds = duration || 5;

            document.getElementById('dvallTitle').textContent = title || 'DVALL';
            document.getElementById('dvallMessage').textContent = message || '';

            bar.classList.remove('animate');
            bar.style.animationDuration = seconds + 's';
            void bar.offsetWidth;
            bar.classList.add('animate');

            clearTimeout(hideTimeout);
            container.classList.remove('hide');
            container.classList.add('show');

            hideTimeout = setTimeout(hideDvall, seconds * 1000);
        }

        function hideDvall() {
            const container = document.getElementById('dvallContainer');
            const bar = document.getElementById('dvallBar');

            container.classList.remove('show');
            container.classList.add('hide');
            bar.classList.remove('animate');
            clearTimeout(hideTimeout);
        }

        window.addEventListener('message', function(event) {
            const data = event.data;

            if (data.type === 'showDvall') {
                showDvall(data.title, data.message, data.time);
            }

            if (data.type === 'hideDvall') {
                hideDvall();
            }
        });
    </script>
</body>
</html>
