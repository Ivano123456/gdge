<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM Reports</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Player Report Menu -->
    <div id="playerReportMenu" class="menu player-menu">
        <div class="menu-header">
            <div class="header-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
            </div>
            <div class="header-content">
                <h2>Pošalji Report</h2>
                <span class="header-subtitle">Opišite vaš problem detaljno</span>
            </div>
        </div>
        <div class="menu-content">
            <div class="input-group">
                <label for="reportText">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="17" y1="10" x2="3" y2="10"></line>
                        <line x1="21" y1="6" x2="3" y2="6"></line>
                        <line x1="21" y1="14" x2="3" y2="14"></line>
                        <line x1="17" y1="18" x2="3" y2="18"></line>
                    </svg>
                    Opis problema
                </label>
                <textarea id="reportText" placeholder="Unesite detaljan opis problema...&#10;&#10;Primer: Igrač me udario vozilom namerno..."></textarea>
            </div>
            <div class="input-footer">
                <div class="char-counter">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 7 4 4 20 4 20 7"></polyline>
                        <line x1="9" y1="20" x2="15" y2="20"></line>
                        <line x1="12" y1="4" x2="12" y2="20"></line>
                    </svg>
                    <span id="charCount">0</span>/500
                </div>
            </div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="sendReport()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                    Pošalji Report
                </button>
                <button class="btn btn-secondary" onclick="closePlayerMenu()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                    Zatvori
                </button>
            </div>
        </div>
        <div class="menu-footer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            Reportovi se automatski šalju administratorima
        </div>
    </div>

    <!-- Admin Reports List Menu -->
    <div id="adminReportMenu" class="menu admin-menu">
        <div class="menu-header admin-header">
            <div class="header-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
            </div>
            <div class="header-content">
                <h2>Admin Panel</h2>
                <span class="header-subtitle">Upravljanje reportovima</span>
            </div>
            <span class="report-count" id="reportCount">0</span>
        </div>
        <div class="menu-content">
            <div class="reports-list" id="reportsList">
                <!-- Reports will be injected here -->
            </div>
            <div class="admin-footer">
                <button class="btn btn-secondary btn-full" onclick="closeAdminMenu()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                    Zatvori Panel
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
